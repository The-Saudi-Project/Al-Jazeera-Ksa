  </g>
  <g stroke="#8FBBD8" stroke-width="3" stroke-linecap="round" opacity=".7">
    <path d="M250 134h26"/><path d="M306 172l12 12"/>
  </g>

  <!-- House and cab -->
  <rect x="66" y="140" width="150" height="54" rx="8" fill="url(#eq2Body)"/>
  <path d="M76 106h58a10 10 0 0 1 10 10v24H66v-24a10 10 0 0 1 10-10Z" fill="#123B57"/>
  <rect x="80" y="114" width="46" height="22" rx="3" fill="#8FBBD8" opacity=".65"/>
  <rect x="66" y="140" width="150" height="8" fill="#C8A96A"/>

  <!-- Counterweight -->
  <path d="M52 148h20v46H52a8 8 0 0 1-8-8v-30a8 8 0 0 1 8-8Z" fill="#0E2C43"/>

  <!-- Undercarriage / tracks -->
  <rect x="52" y="196" width="180" height="16" rx="6" fill="#0E2C43"/>
  <path d="M76 212h132a34 34 0 0 1 0 44H76a34 34 0 0 1 0-44Z" fill="#0C2538"/>
  <path d="M84 220h116a26 26 0 0 1 0 28H84a26 26 0 0 1 0-28Z" fill="#123B57"/>
  <g fill="#0C2538">
    <circle cx="90" cy="234" r="12"/><circle cx="142" cy="234" r="9"/><circle cx="194" cy="234" r="12"/>
  </g>
  <g fill="#0B8A6B"><circle cx="90" cy="234" r="4"/><circle cx="194" cy="234" r="4"/></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img"
     aria-label="Prime mover with a lowbed trailer for heavy equipment transport">
  <!-- Equipment illustration: Lowbed trailer -->
  <defs>
    <linearGradient id="eqTrBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B4A6C"/><stop offset="1" stop-color="#0C2538"/>
    </linearGradient>
  </defs>

  <!-- Prime mover cab -->
  <path d="M36 116h68a10 10 0 0 1 10 10v58H36a8 8 0 0 1-8-8v-52a8 8 0 0 1 8-8Z" fill="url(#eqTrBody)"/>
  <rect x="42" y="126" width="58" height="34" rx="4" fill="#8FBBD8" opacity=".6"/>
  <rect x="28" y="166" width="24" height="10" rx="3" fill="#C8A96A"/>
  <rect x="116" y="96" width="12" height="88" rx="4" fill="#123B57"/>

  <!-- Gooseneck stepping down to the low deck -->
  <path d="M114 184h44l22 30h188v20H114Z" fill="#0E2C43"/>
  <path d="M180 214h188v6H180Z" fill="#0B8A6B"/>

  <!-- Deck load: a crated machine, kept simple so the trailer reads first -->
  <rect x="204" y="164" width="140" height="50" rx="4" fill="#C8A96A" opacity=".9"/>
  <g stroke="#0C2538" stroke-width="2" opacity=".3">
    <path d="M204 188h140M250 164v50M298 164v50"/>
  </g>
  <!-- Lashing straps -->
  <g stroke="#0E2C43" stroke-width="3" opacity=".75">
    <path d="M228 164v50M320 164v50"/>
  </g>

  <!-- Wheels: tractor pair plus a trailer bogie -->
  <g fill="#0C2538">
    <circle cx="72" cy="212" r="24"/><circle cx="144" cy="212" r="24"/>
    <circle cx="290" cy="244" r="18"/><circle cx="330" cy="244" r="18"/><circle cx="370" cy="244" r="18"/>
  </g>
  <g fill="#4C86AD" opacity=".85">
    <circle cx="72" cy="212" r="9"/><circle cx="144" cy="212" r="9"/>
    <circle cx="290" cy="244" r="6"/><circle cx="330" cy="244" r="6"/><circle cx="370" cy="244" r="6"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img"
     aria-label="Tracked hydraulic excavator with boom, arm and bucket">
  <!-- Equipment illustration — Earthmoving & excavation -->
  <defs>
    <linearGradient id="eq2Body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B4A6C"/><stop offset="1" stop-color="#0C2538"/>
    </linearGradient>
  </defs>

  <!-- Boom, arm and bucket -->
  <path d="M198 168 214 96l26 6-10 74Z" fill="#C8A96A"/>
  <path d="M236 100q52-16 92 26l-22 20q-30-30-64-22Z" fill="#C8A96A"/>
  <path d="M306 146 344 190l-18 14-40-44Z" fill="#D6BC85"/>
  <path d="M320 196q30 12 44 2l6 24q-24 14-58-4Z" fill="#0E2C43"/>
  <g fill="#C8A96A"><path d="M362 216h16l-2 16-16-2Z"/></g>
  <!-- Hydraulic rams -->
  <g stroke="#0E2C43" stroke-width="7" stroke-linecap="round">

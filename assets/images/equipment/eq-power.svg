<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img"
     aria-label="Skid mounted diesel generator set in a sound attenuated canopy">
  <!-- Equipment illustration — Power generation & distribution -->
  <defs>
    <linearGradient id="eq5Body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B4A6C"/><stop offset="1" stop-color="#0C2538"/>
    </linearGradient>
  </defs>

  <!-- Canopy -->
  <rect x="56" y="86" width="308" height="130" rx="10" fill="url(#eq5Body)"/>
  <rect x="56" y="86" width="308" height="12" rx="6" fill="#C8A96A"/>

  <!-- Ventilation louvres -->
  <g fill="#8FBBD8" opacity=".3">
    <rect x="80" y="118" width="84" height="7" rx="3"/><rect x="80" y="132" width="84" height="7" rx="3"/>
    <rect x="80" y="146" width="84" height="7" rx="3"/><rect x="80" y="160" width="84" height="7" rx="3"/>
    <rect x="256" y="118" width="84" height="7" rx="3"/><rect x="256" y="132" width="84" height="7" rx="3"/>
    <rect x="256" y="146" width="84" height="7" rx="3"/><rect x="256" y="160" width="84" height="7" rx="3"/>
  </g>

  <!-- Access door and control panel -->
  <rect x="176" y="112" width="68" height="94" rx="4" fill="#123B57"/>
  <rect x="186" y="122" width="48" height="36" rx="3" fill="#0B2537"/>
  <g fill="#0B8A6B"><circle cx="198" cy="134" r="4"/><circle cx="212" cy="134" r="4"/></g>
  <g fill="#C8A96A"><circle cx="226" cy="134" r="4"/></g>
  <g fill="#4C86AD" opacity=".7"><rect x="192" y="146" width="36" height="5" rx="2"/></g>
  <rect x="230" y="168" width="8" height="18" rx="3" fill="#C8A96A"/>

  <!-- Exhaust stack -->
  <g fill="#123B57">
    <rect x="300" y="40" width="20" height="50" rx="4"/>
    <rect x="294" y="34" width="32" height="10" rx="4"/>
  </g>
  <g fill="#C9D6E1" opacity=".55"><ellipse cx="310" cy="18" rx="20" ry="10"/></g>

  <!-- Skid base and forklift pockets -->
  <rect x="42" y="216" width="336" height="26" rx="5" fill="#0E2C43"/>
  <g fill="#0B2537"><rect x="112" y="224" width="44" height="12" rx="3"/><rect x="264" y="224" width="44" height="12" rx="3"/></g>
  <rect x="42" y="216" width="336" height="6" rx="3" fill="#0B8A6B"/>

  <!-- Lifting eyes -->
  <g fill="none" stroke="#C8A96A" stroke-width="5">
    <path d="M104 86v-14a8 8 0 0 1 16 0v14"/>
    <path d="M300 86v-14"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img"
     aria-label="Towable diesel air compressor with hose reel">
  <!-- Equipment illustration: Air compressor -->
  <defs>
    <linearGradient id="eqCompBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B4A6C"/><stop offset="1" stop-color="#0C2538"/>
    </linearGradient>
  </defs>

  <!-- Canopy -->
  <path d="M86 96h248a12 12 0 0 1 12 12v98H74v-98a12 12 0 0 1 12-12Z" fill="url(#eqCompBody)"/>
  <rect x="74" y="96" width="272" height="11" rx="5" fill="#C8A96A"/>

  <!-- Ventilation louvres -->
  <g fill="#8FBBD8" opacity=".3">
    <rect x="96" y="126" width="76" height="7" rx="3"/>
    <rect x="96" y="140" width="76" height="7" rx="3"/>
    <rect x="96" y="154" width="76" height="7" rx="3"/>
    <rect x="96" y="168" width="76" height="7" rx="3"/>
  </g>

  <!-- Control panel and outlet valves -->
  <rect x="188" y="122" width="64" height="58" rx="4" fill="#0B2537"/>
  <circle cx="206" cy="142" r="11" fill="#123B57"/><circle cx="206" cy="142" r="4" fill="#C8A96A"/>
  <circle cx="236" cy="142" r="11" fill="#123B57"/><circle cx="236" cy="142" r="4" fill="#0B8A6B"/>
  <g fill="#4C86AD" opacity=".7"><rect x="196" y="164" width="48" height="6" rx="3"/></g>

  <!-- Hose reel -->
  <circle cx="300" cy="150" r="34" fill="#123B57"/>
  <circle cx="300" cy="150" r="22" fill="#0B2537"/>
  <circle cx="300" cy="150" r="9" fill="#C8A96A"/>
  <path d="M334 150q16 22 8 52" fill="none" stroke="#0E2C43" stroke-width="7" stroke-linecap="round"/>

  <!-- Chassis, tow hitch and wheels -->
  <rect x="66" y="206" width="288" height="16" rx="5" fill="#0E2C43"/>
  <rect x="66" y="206" width="288" height="5" rx="2" fill="#0B8A6B"/>
  <path d="M66 214H26" stroke="#0E2C43" stroke-width="8" stroke-linecap="round"/>
  <circle cx="20" cy="214" r="9" fill="#C8A96A"/>
  <g fill="#0C2538"><circle cx="128" cy="230" r="18"/><circle cx="292" cy="230" r="18"/></g>
  <g fill="#4C86AD" opacity=".85"><circle cx="128" cy="230" r="7"/><circle cx="292" cy="230" r="7"/></g>
</svg>

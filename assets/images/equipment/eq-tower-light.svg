<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img"
     aria-label="Mobile lighting tower with four floodlights on a telescopic mast">
  <!-- Equipment illustration: Lighting tower -->

  <!-- Light spill, drawn first so the lamps sit on top of it -->
  <path d="M210 62 96 20h228Z" fill="#C8A96A" opacity=".16"/>

  <!-- Floodlight heads -->
  <g fill="#C8A96A">
    <rect x="140" y="40" width="40" height="26" rx="4"/>
    <rect x="186" y="40" width="40" height="26" rx="4"/>
    <rect x="232" y="40" width="40" height="26" rx="4"/>
  </g>
  <g fill="#E2D2AE">
    <rect x="146" y="46" width="28" height="14" rx="2"/>
    <rect x="192" y="46" width="28" height="14" rx="2"/>
    <rect x="238" y="46" width="28" height="14" rx="2"/>
  </g>
  <rect x="134" y="66" width="144" height="8" rx="4" fill="#0E2C43"/>

  <!-- Telescopic mast -->
  <rect x="200" y="74" width="14" height="52" rx="4" fill="#123B57"/>
  <rect x="196" y="122" width="22" height="46" rx="4" fill="#1B4A6C"/>
  <rect x="192" y="164" width="30" height="40" rx="4" fill="#0E2C43"/>

  <!-- Generator body on a towable chassis -->
  <rect x="120" y="196" width="174" height="46" rx="8" fill="#1B4A6C"/>
  <rect x="120" y="196" width="174" height="8" rx="4" fill="#0B8A6B"/>
  <g fill="#8FBBD8" opacity=".3">
    <rect x="136" y="214" width="52" height="6" rx="3"/>
    <rect x="136" y="226" width="52" height="6" rx="3"/>
    <rect x="228" y="214" width="52" height="6" rx="3"/>
    <rect x="228" y="226" width="52" height="6" rx="3"/>
  </g>

  <!-- Tow hitch and road wheels -->
  <path d="M120 224H74" stroke="#0E2C43" stroke-width="8" stroke-linecap="round"/>
  <circle cx="66" cy="224" r="9" fill="#C8A96A"/>
  <g fill="#0C2538"><circle cx="160" cy="248" r="17"/><circle cx="256" cy="248" r="17"/></g>
  <g fill="#4C86AD" opacity=".85"><circle cx="160" cy="248" r="6"/><circle cx="256" cy="248" r="6"/></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img"
     aria-label="Articulated boom lift with an elevated work platform">
  <!-- Equipment illustration — Aerial access platforms -->
  <defs>
    <linearGradient id="eq4Body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B4A6C"/><stop offset="1" stop-color="#0C2538"/>
    </linearGradient>
  </defs>

  <!-- Articulated boom -->
  <path d="M150 178 168 118l24 8-16 58Z" fill="#C8A96A"/>
  <path d="M170 122 196 62l24 12-24 58Z" fill="#D6BC85"/>
  <path d="M200 68h132v20H204Z" fill="#C8A96A"/>
  <circle cx="170" cy="122" r="9" fill="#0E2C43"/>
  <circle cx="200" cy="70" r="8" fill="#0E2C43"/>

  <!-- Work platform with guardrails -->
  <g>
    <rect x="322" y="86" width="72" height="10" rx="3" fill="#0E2C43"/>
    <g fill="#0B8A6B">
      <rect x="322" y="40" width="7" height="48" rx="3"/>
      <rect x="387" y="40" width="7" height="48" rx="3"/>
      <rect x="322" y="40" width="72" height="7" rx="3"/>
      <rect x="322" y="62" width="72" height="5" rx="2"/>
    </g>
  </g>

  <!-- Turntable and chassis -->
  <rect x="106" y="176" width="120" height="34" rx="7" fill="url(#eq4Body)"/>
  <rect x="60" y="200" width="248" height="34" rx="7" fill="#0E2C43"/>
  <rect x="60" y="200" width="248" height="8" rx="3" fill="#C8A96A"/>
  <rect x="240" y="172" width="58" height="34" rx="6" fill="#123B57"/>
  <rect x="250" y="180" width="38" height="18" rx="3" fill="#8FBBD8" opacity=".6"/>

  <!-- Wheels -->
  <g fill="#0C2538"><circle cx="104" cy="238" r="24"/><circle cx="268" cy="238" r="24"/></g>
  <g fill="#4C86AD" opacity=".85"><circle cx="104" cy="238" r="9"/><circle cx="268" cy="238" r="9"/></g>

  <!-- Stability outriggers -->
  <g fill="#0B8A6B"><rect x="44" y="242" width="30" height="8" rx="3"/><rect x="296" y="242" width="30" height="8" rx="3"/></g>
</svg>
